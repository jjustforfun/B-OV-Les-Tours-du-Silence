<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Audit du cycle de vie, des libérations et des allocations</title>
  <desc id="desc">Preuve technique datée du 28 septembre 2026. Les cycles Node sont verts et les mesures exigeant un navigateur WebGL restent orange.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101722"/>
      <stop offset="1" stop-color="#192637"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#263b50"/>
      <stop offset="1" stop-color="#1d2c3d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#05080c" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 34px system-ui, sans-serif; fill: #f6f1e7; letter-spacing: .3px; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #b9c7d4; }
      .section { font: 700 19px system-ui, sans-serif; fill: #f6f1e7; }
      .label { font: 600 17px system-ui, sans-serif; fill: #e4ebf1; }
      .detail { font: 400 14px system-ui, sans-serif; fill: #aebdcc; }
      .metric { font: 750 25px system-ui, sans-serif; fill: #dce9f2; }
      .ok { fill: #85d6a0; }
      .wait { fill: #f0b45a; }
      .pill { font: 700 13px system-ui, sans-serif; letter-spacing: .8px; }
      .mono { font: 500 14px ui-monospace, SFMono-Regular, monospace; fill: #c9d6e1; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1275" cy="90" r="175" fill="#d59b3d" opacity="0.06"/>
  <circle cx="80" cy="840" r="210" fill="#70c893" opacity="0.05"/>

  <g transform="translate(70 58)">
    <text class="title" x="0" y="0">Cycle de vie · dispose · allocations</text>
    <text class="subtitle" x="0" y="34">Phase 10.5 — preuve automatisée sans renderer WebGL · 2026-09-28</text>
    <rect x="1082" y="-20" width="178" height="42" rx="21" fill="#173d2a" stroke="#85d6a0"/>
    <text class="pill ok" x="1171" y="7" text-anchor="middle">NODE VALIDÉ</text>
  </g>

  <g transform="translate(70 130)" filter="url(#shadow)">
    <rect width="1260" height="205" rx="16" fill="#162230" stroke="#34495d"/>
    <rect width="1260" height="48" rx="16" fill="url(#header)"/>
    <path d="M0 32 Q0 48 16 48 H1244 Q1260 48 1260 32 V48 H0Z" fill="url(#header)"/>
    <text class="section" x="24" y="31">Cycles automatisés</text>

    <g transform="translate(28 74)">
      <text class="metric ok" x="0" y="27">16</text>
      <text class="label" x="0" y="55">transitions LevelLoader</text>
      <text class="detail" x="0" y="79">8 chapitres parcourus deux fois</text>
      <text class="mono" x="0" y="103">instance neuve · graphe vide · root vide</text>
    </g>
    <line x1="330" y1="75" x2="330" y2="180" stroke="#34495d"/>
    <g transform="translate(365 74)">
      <text class="metric ok" x="0" y="27">10</text>
      <text class="label" x="0" y="55">cycles LevelRuntime</text>
      <text class="detail" x="0" y="79">abonnements globaux stables</text>
      <text class="mono" x="0" y="103">bus 0→2→0 · input 0→11→0</text>
    </g>
    <line x1="650" y1="75" x2="650" y2="180" stroke="#34495d"/>
    <g transform="translate(685 74)">
      <text class="metric ok" x="0" y="27">1×</text>
      <text class="label" x="0" y="55">dispose par ressource</text>
      <text class="detail" x="0" y="79">géométrie, matériau, map et uniform</text>
      <text class="mono" x="0" y="103">partage dédupliqué · appels idempotents</text>
    </g>
    <line x1="975" y1="75" x2="975" y2="180" stroke="#34495d"/>
    <g transform="translate(1010 74)">
      <text class="metric ok" x="0" y="27">0</text>
      <text class="label" x="0" y="55">timer FX résiduel</text>
      <text class="detail" x="0" y="79">pétales annulés au detach</text>
      <text class="mono" x="0" y="103">timers &gt;0 → 0</text>
    </g>
  </g>

  <g transform="translate(70 365)" filter="url(#shadow)">
    <rect width="1260" height="242" rx="16" fill="#162230" stroke="#34495d"/>
    <rect width="1260" height="48" rx="16" fill="url(#header)"/>
    <text class="section" x="24" y="31">Allocations récurrentes retirées des chemins chauds</text>

    <g transform="translate(28 76)">
      <circle cx="10" cy="9" r="8" fill="#85d6a0"/>
      <text class="label" x="32" y="15">EventBus.emit</text>
      <text class="detail" x="32" y="39">snapshots réutilisés par profondeur, émission imbriquée conservée</text>
    </g>
    <g transform="translate(650 76)">
      <circle cx="10" cy="9" r="8" fill="#85d6a0"/>
      <text class="label" x="32" y="15">ParticlePool.update</text>
      <text class="detail" x="32" y="39">damping scalaire, sans closure par image</text>
    </g>
    <g transform="translate(28 145)">
      <circle cx="10" cy="9" r="8" fill="#85d6a0"/>
      <text class="label" x="32" y="15">GoldenTrail.update</text>
      <text class="detail" x="32" y="39">position écrite dans trois scalaires, sans tuple temporaire</text>
    </g>
    <g transform="translate(650 145)">
      <circle cx="10" cy="9" r="8" fill="#85d6a0"/>
      <text class="label" x="32" y="15">Mouvement réduit</text>
      <text class="detail" x="32" y="39">une MediaQueryList vivante pour toutes les images</text>
    </g>
    <rect x="28" y="201" width="1204" height="1" fill="#34495d"/>
    <text class="mono" x="28" y="224">329 tests / 51 fichiers · ESLint 0/0 · TypeScript 0 · preuve XML valide</text>
  </g>

  <g transform="translate(70 637)" filter="url(#shadow)">
    <rect width="1260" height="190" rx="16" fill="#241f19" stroke="#9d743d"/>
    <rect width="1260" height="48" rx="16" fill="#3a2e20"/>
    <text class="section" x="24" y="31">Mesures réelles encore requises</text>
    <rect x="1068" y="10" width="164" height="28" rx="14" fill="#4a3218" stroke="#f0b45a"/>
    <text class="pill wait" x="1150" y="29" text-anchor="middle">WEBGL OUVERT</text>

    <g transform="translate(28 73)">
      <text class="label wait" x="0" y="16">01</text>
      <text class="label" x="44" y="16">renderer.info.memory après 5 allers-retours</text>
      <text class="detail" x="44" y="40">géométries et textures doivent revenir à la ligne de base</text>
    </g>
    <g transform="translate(520 73)">
      <text class="label wait" x="0" y="16">02</text>
      <text class="label" x="44" y="16">10 changements réellement rendus</text>
      <text class="detail" x="44" y="40">aucun objet WebGL résiduel côté renderer et pilote</text>
    </g>
    <g transform="translate(940 73)">
      <text class="label wait" x="0" y="16">03</text>
      <text class="label" x="44" y="16">courbe mémoire 5 minutes</text>
      <text class="detail" x="44" y="40">profil Chrome DevTools sans croissance de fond</text>
    </g>
    <text class="mono" x="28" y="159">Protocole reproductible : docs/PERFORMANCE.md § 4.5 · aucun résultat navigateur simulé</text>
  </g>

  <text class="detail" x="70" y="868">BӀOV : Les Tours du Silence · preuve technique, non substitutive à une capture ou à un profil WebGL</text>
</svg>
